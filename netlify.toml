[build]
  command = "npm run build"
  publish = "dist"

# transformers.js ships a multi-threaded ONNX runtime
# (ort-wasm-simd-threaded.jsep.wasm). Its worker pool needs SharedArrayBuffer,
# which the browser only exposes on a cross-origin-isolated page. Without these
# two headers the runtime silently drops to the single-threaded build — it still
# works, just slower. These mirror the dev-server headers in vite.config.ts.
#
# require-corp blocks *no-cors* subresources only; the CORS fetches to the
# HuggingFace Space backend are unaffected.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# The 21 MB wasm blob is content-hashed by Vite, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
